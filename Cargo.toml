[workspace]
resolver = "2"
members = ["zek-core", "zek-cli"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
rust-version = "1.80"
authors = ["thezeeck"]
repository = "https://github.com/thezeeck/zek"
homepage = "https://github.com/thezeeck/zek"
keywords = ["cli", "workflow", "orchestrator", "claude", "opencode"]
categories = ["command-line-utilities", "development-tools"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
